<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink="/links">Shortlinks</a></li>
    <li class="breadcrumb-item active" aria-current="page">New Link</li>
  </ol>
</nav>

<h1>Create a new Shortlink</h1>

<alert-message [message]="errorMessage()" [type]="'error'"></alert-message>

<p>Form Valid: {{ createLinkForm.valid }}</p>

<form
  name="createLink"
  #createLinkForm="ngForm"
  (ngSubmit)="createLink(createLinkForm)">
  <div class="mb-3">
    <label for="slug" class="form-label">Custom Slug (leave empty for random Slug)</label>
    <input
      type="text"
      class="form-control"
      id="slug"
      aria-describedby="slugHelp"
      [(ngModel)]="formSlug"
      name="slug"
      [disabled]="isLoading()">
    <div id="slugHelp" class="form-text">Only alphanumeric characters (A-Z, a-z, 0-9)</div>
  </div>
  <div class="mb-3">
    <label for="target" class="form-label">Redirect Target <span class="required-addon"></span></label>
    <input
      type="text"
      class="form-control"
      id="target"
      aria-describedby="targetHelp"
      placeholder="https://..."
      [(ngModel)]="formTarget"
      name="target"
      required
      [disabled]="isLoading()">
    <div id="targetHelp" class="form-text">URL, mailto:, etc.</div>
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea
      class="form-control"
      id="description"
      rows="3"
      [(ngModel)]="formDescription"
      name="description"
      [disabled]="isLoading()"></textarea>
  </div>

  <div class="d-flex align-items-center justify-content-start">
    <button
      type="submit"
      class="btn btn-success"
      id="submitButton"
      [disabled]="createLinkForm.invalid || isLoading()"
    >
      @if (isLoading()) {
        <div class="d-flex align-items-center justify-content-start">
          <div class="spinner-border spinner-border-sm text-light" role="status" aria-hidden="true">
          </div>
          <span role="status" class="ms-2">Creating...</span>
        </div>
      } @else {
        Create
      }
    </button>


  </div>
</form>
